name: Build

on:
  push:
    paths-ignore:
      - "documents/**"
      - ".github/**"
      - "assets/**"
  pull_request:
    types: [ready_for_review, opened, synchronize, reopened]
    paths-ignore:
      - "documents/**"
      - ".github/**"
      - "assets/**"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: cargo build (${{ matrix.name }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default features
            features: ""
          # No `xdp` here. It builds the libbpf vendored by libxdp-sys, 
          # which fails on newer toolchains.
          - name: selected features
            features: "--features drift-stat,drift-log,first-packet,first-payload,http,nat"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt update && sudo apt install pkg-config m4 clang llvm libelf-dev libpcap-dev gcc-multilib libnftnl-dev libmnl-dev autoconf automake autopoint flex bison gawk libtool -y
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo check --workspace ${{ matrix.features }}
      - run: cargo build --workspace ${{ matrix.features }}

  clippy:
    name: cargo clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default features
            features: ""
            # No `xdp` here. It builds the libbpf vendored by libxdp-sys, 
            # which fails on newer toolchains.
          - name: selected features
            features: "--features drift-stat,drift-log,first-packet,first-payload,http,nat"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt update && sudo apt install pkg-config m4 clang llvm libelf-dev libpcap-dev gcc-multilib libnftnl-dev libmnl-dev autoconf automake autopoint flex bison gawk libtool -y
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo clippy --workspace ${{ matrix.features }} --tests -- -Dwarnings

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  audit:
    name: Run cargo audit
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions-rust-lang/audit@v1

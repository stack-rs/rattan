- name: set service configuration directory
  become: true
  ansible.builtin.file:
    path: /etc/runner
    state: directory

- name: write docker client proxy config for job-spawned containers
  become: true
  ansible.builtin.copy:
    dest: /etc/runner/docker-config.json
    content: |
      {
        "proxies": {
          "default": {
            "httpProxy": "{{ http_proxy | default('') }}",
            "httpsProxy": "{{ http_proxy | default('') }}",
            "noProxy": "localhost,127.0.0.1,::1"
          }
        }
      }

- name: copy github-runner docker-compose file
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /etc/runner/docker-compose.yml

- name: poll a image
  become: true
  community.docker.docker_image:
    name: "docker.io/myoung34/github-runner:{{ tag }}"
    source: pull

- name: install rattan-runner systemd service
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../systemd/rattan-runner.service"
    dest: /etc/systemd/system/rattan-runner.service
    owner: root
    group: root
    mode: "0644"

# Only enable here: the runner registers itself on first boot of the real VM
# instead of inside the packer build VM (where it could pick up CI jobs).
- name: enable rattan-runner service at boot
  become: true
  ansible.builtin.systemd:
    name: rattan-runner.service
    daemon_reload: true
    enabled: true
